  <div class="modal" id="request-modal" role="dialog" aria-modal="true" aria-labelledby="request-title" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog">
      <button class="modal__close" type="button" aria-label="Закрыть" data-close>×</button>
      <h2 id="request-title">Заказать звонок</h2>
      <p class="modal__lead">Оставьте контакты — перезвоним в рабочее время и ответим на вопросы.</p>
      <form class="form" data-form="request" novalidate>
        <div class="form__product" hidden>
          <span>Оборудование:</span> <b data-product-name></b>
          <input type="hidden" name="product">
        </div>
        <label class="field">
          <span>Ваше имя</span>
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <label class="field">
          <span>Телефон</span>
          <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" required>
        </label>
        <label class="field">
          <span>Электронная почта <i>(необязательно)</i></span>
          <input name="email" type="email" autocomplete="email">
        </label>
        <label class="field">
          <span>Комментарий <i>(необязательно)</i></span>
          <textarea name="message" rows="3" placeholder="Например: нужна установка испытания кабелей до 110 кВ"></textarea>
        </label>
        <label class="check">
          <input type="checkbox" name="consent" required>
          <span>Согласен на <a href="{{site.consent}}" target="_blank" rel="noopener">обработку персональных данных</a></span>
        </label>
        <button class="btn btn--primary btn--block btn--lg" type="submit">Отправить</button>
        <p class="form__status" role="status"></p>
      </form>
    </div>
  </div>
